apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: frontend   # note: "environment" label is missing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:latest