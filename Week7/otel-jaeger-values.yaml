mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.100.0

config:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

  exporters:
    jaeger:
      endpoint: jaeger-collector.monitoring.svc.cluster.local:14250
      tls:
        insecure: true

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: []
        exporters: [jaeger]
