apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-nodeselector-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ns
  template:
    metadata:
      labels:
        app: nginx-ns
    spec:
      nodeSelector:
        environment: test
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80