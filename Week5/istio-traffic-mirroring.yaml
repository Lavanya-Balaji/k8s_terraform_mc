# -------------------------------
# Deployment: API v1
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      version: v1
  template:
    metadata:
      labels:
        app: api
        version: v1
    spec:
      containers:
      - name: api
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80

---
# -------------------------------
# Deployment: API v2 (mirror target)
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      version: v2
  template:
    metadata:
      labels:
        app: api
        version: v2
    spec:
      containers:
      - name: api
        image: kennethreitz/httpbin
        ports:
        - containerPort: 80

---
# -------------------------------
# Service (shared)
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: my-namespace
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80

---
# -------------------------------
# Istio Gateway
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: my-gateway
  namespace: my-namespace
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

---
# -------------------------------
# DestinationRule (for subsets)
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-dr
  namespace: my-namespace
spec:
  host: api-service
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2

---
# -------------------------------
# VirtualService (Mirroring)
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-vs
  namespace: my-namespace
spec:
  hosts:
  - "*"
  gateways:
  - my-gateway
  http:
  - match:
    - uri:
        prefix: /api

    rewrite:
      uri: /get   # normal request

    route:
    - destination:
        host: api-service
        subset: v1
        port:
          number: 80

    mirror:
      host: api-service
      subset: v2

    mirrorPercentage:
      value: 100.0