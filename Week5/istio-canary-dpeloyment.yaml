# -------------------------------
# Deployment: API BLUE (stable)
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-blue
  namespace: my-namespace
spec:
  replicas: 5
  selector:
    matchLabels:
      app: api
      version: blue
  template:
    metadata:
      labels:
        app: api
        version: blue
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args:
        - "-text=Response from API BLUE"
        ports:
        - containerPort: 5678

---
# -------------------------------
# Deployment: API GREEN (canary)
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-green
  namespace: my-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
      version: green
  template:
    metadata:
      labels:
        app: api
        version: green
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo
        args:
        - "-text=Response from API GREEN"
        ports:
        - containerPort: 5678

---
# -------------------------------
# Service
# -------------------------------
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: my-namespace
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 5678

---
# -------------------------------
# Istio Gateway
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: my-gateway
  namespace: my-namespace
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"

---
# -------------------------------
# DestinationRule
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-destination
  namespace: my-namespace
spec:
  host: api-service
  subsets:
  - name: blue
    labels:
      version: blue
  - name: green
    labels:
      version: green

---
# -------------------------------
# VirtualService (Canary 90/10)
# -------------------------------
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-vs
  namespace: my-namespace
spec:
  hosts:
  - "*"
  gateways:
  - my-gateway
  http:
  - match:
    - uri:
        prefix: /api
    route:
    - destination:
        host: api-service
        subset: blue
        port:
          number: 80
      weight: 90
    - destination:
        host: api-service
        subset: green
        port:
          number: 80
      weight: 10